name: Documentation checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR checkout is the merge commit; its first parent is the base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install documentation parsers
        run: 'python -m pip install --only-binary=:all: -r dev-tools/docs/requirements.txt'
      - name: Test the checker
        run: python -B -m unittest discover -s dev-tools/docs -p 'test_*.py' -v
      - name: Check documentation and changed whitespace
        env:
          DOC_DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^' || 'HEAD' }}
        run: python -B dev-tools/docs/check_docs.py --base "$DOC_DIFF_BASE"
